<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookout · Find a cause near you</title>
<meta name="description" content="Find nonprofits in Denver and Boulder that need your time, money, goods or skills.">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@200;300;400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#F1F5F6}
a{color:#18303C}a:hover{color:#8A430E}
button,input,select,textarea{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #2F6A90;outline-offset:2px}
.stone{transition:transform .15s ease, box-shadow .15s ease}
.stone:hover{transform:translateY(-2px)}
.jl-short{display:none}
@media (max-width: 900px){.rv-bg{display:none}}
@media (prefers-reduced-motion: reduce){.stone{transition:none}.stone:hover{transform:none}}
@media (max-width: 700px){
.jl-long{display:none}.jl-short{display:inline}
.hdr-link{display:none}
[style*="max-width:1240px"]{padding-left:16px!important;padding-right:16px!important}
h1{font-size:36px!important;line-height:1.08!important}
h2{font-size:26px!important}
h2#h-matches{font-size:34px!important}
[role="group"][aria-label="Your selections so far"]{border-radius:16px!important}
[role="group"][aria-label="Your selections so far"] > *{flex-basis:100%!important;border-right:0!important;border-bottom:1px solid rgba(24,48,60,0.12)}
svg[aria-label^="Hairline panorama"] text,svg[aria-label^="Trail map"] text{display:none}
.mlbl{font-size:9px!important;white-space:normal!important;width:60px;text-align:center;line-height:1.1}
.mlbl.off{display:none!important}
.mcount{display:none}
[style*="margin-left:auto"]{display:none!important}
}
</style>
</head>
<body>
<div id="app"></div>
<template id="dc">

<div style="font-family:'Archivo',system-ui,sans-serif;color:#18303C;background:linear-gradient(172deg,#DCEBF4 0%,#F1F5F6 48%,#F7EDE2 100%);min-height:1800px">


<header style="background:rgba(255,255,255,0.7);border-bottom:1px solid rgba(24,48,60,0.14)">
  <div style="max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;flex-wrap:wrap;align-items:center;gap:16px;justify-content:space-between">
    <div style="display:flex;align-items:center;gap:12px">
      <div style="position:relative" onKeyDown="{{menuKey}}">
        <button type="button" onClick="{{toggleMenu}}" aria-expanded="{{menuExpanded}}" aria-controls="journey-menu" aria-label="{{menuAria}}" style="display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;background:#18303C;color:#FFFFFF;border:0;border-radius:999px;cursor:pointer;font-size:14px;font-weight:600">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{menuChevron}}"></path></svg>
        </button>
        <sc-if value="{{menuOpen}}" hint-placeholder-val="{{false}}">
          <div id="journey-menu" style="position:absolute;top:calc(100% + 8px);left:0;z-index:50;width:300px;max-width:calc(100vw - 32px);box-sizing:border-box;background:#FFFFFF;border:1px solid #C9D6DC;border-radius:8px;box-shadow:0 12px 32px rgba(24,48,60,0.18);padding:10px;display:flex;flex-direction:column;gap:2px">
            <span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#4D6370;padding:6px 10px">User journey</span>
            <sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
              <button type="button" onClick="{{s.go}}" aria-current="{{s.current}}" style="{{s.itemStyle}}"><span style="{{s.numStyle}}">{{s.n}}</span>{{s.label}}</button>
            </sc-for>
            <div style="height:1px;background:#DCE6EA;margin:6px 4px"></div>
            <span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;color:#4D6370;padding:6px 10px">More</span>
            <sc-for list="{{extras}}" as="s" hint-placeholder-count="2">
              <button type="button" onClick="{{s.go}}" aria-current="{{s.current}}" style="{{s.itemStyle}}"><span style="{{s.numStyle}}">{{s.n}}</span>{{s.label}}</button>
            </sc-for>
          </div>
        </sc-if>
      </div>
      <button type="button" onClick="{{goHome}}" aria-label="Lookout home" style="display:inline-flex;align-items:center;gap:12px;background:none;border:0;padding:0;min-height:48px;cursor:pointer;color:#18303C">
      <svg width="34" height="34" viewBox="0 0 30 30" aria-hidden="true"><path d="M2 24 L11 12 L16 18 L21 9 L28 24" fill="none" stroke="#18303C" stroke-width="1.4" stroke-linejoin="round"></path><circle cx="21" cy="5" r="2.2" fill="#E89A5B"></circle><path d="M2 27 H28" stroke="#9FB2BC" stroke-width="1"></path></svg><span style="font-family:'Archivo',sans-serif;font-size:26px;font-weight:300;letter-spacing:-0.03em;line-height:1">lookout</span>
    </button>
    </div>
    <nav aria-label="Main" style="display:flex;flex-wrap:wrap;align-items:center;gap:4px">
      <button type="button" class="hdr-link" onClick="{{goHome}}" style="min-height:44px;padding:0 14px;background:none;border:0;font-size:15px;font-weight:600;color:#18303C;cursor:pointer">Find a cause</button>
      <button type="button" class="hdr-link" onClick="{{goRatings}}" style="min-height:44px;padding:0 14px;background:none;border:0;font-size:15px;font-weight:600;color:#18303C;cursor:pointer">About the ratings</button>
      <button type="button" class="hdr-link" onClick="{{goSuggest}}" style="min-height:44px;padding:0 14px;background:none;border:0;font-size:15px;font-weight:600;color:#18303C;cursor:pointer">Suggestions</button>
      <button type="button" onClick="{{goShare}}" style="display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;background:#18303C;border:0;border-radius:999px;font-size:15px;font-weight:600;color:#FFFFFF;cursor:pointer">Your list · {{savedCount}}</button>
    </nav>
  </div>
</header>


<!-- ============ 1 · HOME: two rivers meet ============ -->
<sc-if value="{{isHome}}" hint-placeholder-val="{{true}}">
<div>
<section style="position:relative;overflow:hidden">
  <div style="max-width:1240px;margin:0 auto;padding:48px 24px 0;display:flex;flex-direction:column;gap:14px">
    <h1 style="margin:0;max-width:17ch;font-family:'Archivo',sans-serif;font-size:56px;line-height:1.04;letter-spacing:-0.04em;font-weight:200;text-wrap:balance">Make an impact on your community.</h1>
    <p style="margin:0;max-width:56ch;font-size:18px;line-height:1.55;color:#2F4753">Match your time, money, spare goods or skills to Denver and Boulder organizations that need them.</p>
    <div role="group" aria-label="Your selections so far" style="display:flex;flex-wrap:wrap;margin-top:8px;border:1px solid #9FB2BC;border-radius:999px;background:rgba(255,255,255,0.78);max-width:820px;overflow:hidden">
      <div style="padding:10px 20px;display:grid;gap:1px;border-right:1px solid rgba(24,48,60,0.12);flex:1 1 170px;min-width:0"><span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#4D6370">I can give</span><span style="font-size:16px;color:#18303C">{{giveText}}</span></div><div style="padding:10px 20px;display:grid;gap:1px;border-right:1px solid rgba(24,48,60,0.12);flex:1 1 170px;min-width:0"><span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#4D6370">Cause</span><span style="font-size:16px;color:#18303C">{{causeText}}</span></div><div style="padding:10px 20px;display:grid;gap:1px;border-right:1px solid rgba(24,48,60,0.12);flex:1 1 170px;min-width:0"><span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#4D6370">Near</span><span style="font-size:16px;color:#18303C">Denver metro</span></div>
      <a href="#matches" style="display:inline-flex;align-items:center;justify-content:center;min-height:56px;padding:0 28px;background:#18303C;color:#F7FAFB;font-size:15px;font-weight:500;text-decoration:none">See matches</a>
    </div>
    <span style="font-size:13px;color:#4D6370">Choose below and these update.</span>
  </div>
  <div style="max-width:1240px;margin:0 auto;padding:0 24px">
  <svg role="img" aria-label="Hairline panorama of the Front Range with markers for open needs in Boulder, Lafayette and Louisville, Aurora and Denver" viewBox="0 0 1100 260" style="display:block;width:100%;height:auto;margin-top:28px">
  <defs><linearGradient id="haze" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F7EDE2" stop-opacity="0"></stop><stop offset="1" stop-color="#F7EDE2" stop-opacity=".9"></stop></linearGradient></defs>
  <path d="M0 150 L60 128 L110 138 L170 96 L215 118 L260 84 L300 108 L345 76 L392 104 L440 90 L490 112 L540 70 L585 98 L640 86 L690 110 L740 80 L790 104 L840 92 L900 118 L960 100 L1020 124 L1100 112" fill="none" stroke="#9FB2BC" stroke-width="1"></path>
  <path d="M0 176 Q90 150 180 168 T360 160 T540 172 T720 158 T900 170 T1100 162" fill="none" stroke="#5E7480" stroke-width="1"></path>
  <g fill="none" stroke="#C3D1D8" stroke-width="0.8"><path d="M0 196 Q275 186 550 196 T1100 192"></path><path d="M0 214 Q275 206 550 216 T1100 210"></path><path d="M0 232 Q275 226 550 234 T1100 230"></path></g>
  <path d="M260 176 C330 200 420 190 520 214 S760 236 1100 226" fill="none" stroke="#5A8FB0" stroke-width="1.1"></path>
  <rect x="0" y="180" width="1100" height="80" fill="url(#haze)"></rect>
  <circle cx="880" cy="46" r="16" fill="none" stroke="#E89A5B" stroke-width="1"></circle>
  <g font-family="IBM Plex Mono, monospace" font-size="12" fill="#18303C">
    <circle cx="220" cy="192" r="10" fill="#F8DCC4"></circle><circle cx="220" cy="192" r="3.5" fill="#E89A5B"></circle><line x1="220" y1="188" x2="220" y2="140" stroke="#18303C" stroke-width="0.8"></line><text x="226" y="138">BOULDER · 7 open</text>
    <circle cx="430" cy="206" r="10" fill="#F8DCC4"></circle><circle cx="430" cy="206" r="3.5" fill="#E89A5B"></circle><line x1="430" y1="202" x2="430" y2="150" stroke="#18303C" stroke-width="0.8"></line><text x="436" y="148">LAFAYETTE + LOUISVILLE · 6 open</text>
    <circle cx="600" cy="214" r="3.5" fill="#4E7D6A"></circle><line x1="600" y1="210" x2="600" y2="176" stroke="#18303C" stroke-width="0.8"></line><text x="606" y="174">AURORA · 2 open</text>
    <circle cx="800" cy="222" r="10" fill="#F8DCC4"></circle><circle cx="800" cy="222" r="3.5" fill="#E89A5B"></circle><line x1="800" y1="218" x2="800" y2="140" stroke="#18303C" stroke-width="0.8"></line><text x="806" y="138">DENVER · 57 open</text>
    <text x="16" y="250" font-size="10" fill="#4D6370" letter-spacing="1">LOOKING EAST FROM LOOKOUT MTN · 7,377 FT</text>
  </g>
</svg>
  </div>
  <div style="display:flex;flex-wrap:wrap;border-top:1px solid rgba(24,48,60,0.12);background:rgba(255,255,255,0.55)">
    <div style="padding:16px 24px;flex:1 1 200px;display:grid;gap:2px;border-right:1px solid rgba(24,48,60,0.1)"><span style="font-family:'Archivo',sans-serif;font-weight:200;font-size:34px;letter-spacing:-0.04em;line-height:1.05;font-variant-numeric:tabular-nums">{{statOpen}}</span><span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#4D6370">Open needs</span></div><div style="padding:16px 24px;flex:1 1 200px;display:grid;gap:2px;border-right:1px solid rgba(24,48,60,0.1)"><span style="font-family:'Archivo',sans-serif;font-weight:200;font-size:34px;letter-spacing:-0.04em;line-height:1.05;font-variant-numeric:tabular-nums">{{statSkills}}</span><span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#4D6370">Need specific skills</span></div><div style="padding:16px 24px;flex:1 1 200px;display:grid;gap:2px;border-right:1px solid rgba(24,48,60,0.1)"><span style="font-family:'Archivo',sans-serif;font-weight:200;font-size:34px;letter-spacing:-0.04em;line-height:1.05;font-variant-numeric:tabular-nums">{{statGoods}}</span><span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#4D6370">Collecting goods</span></div><div style="padding:16px 24px;flex:1 1 200px;display:grid;gap:2px;border-right:1px solid rgba(24,48,60,0.1)"><span style="font-family:'Archivo',sans-serif;font-weight:200;font-size:34px;letter-spacing:-0.04em;line-height:1.05;font-variant-numeric:tabular-nums">{{statMoney}}</span><span style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:#4D6370">Money campaigns</span></div>
  </div>
  <div style="padding:10px 24px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.04em;color:#4D6370;max-width:1240px;margin:0 auto">Organizations come from the Lookout research list. Ways to help come from each organization’s website, checked Nov 24, 2026. Drive times from Golden are approximate.</div>
</section>

<section aria-labelledby="h-rivers" style="max-width:1240px;margin:0 auto;padding:40px 24px 16px;display:flex;flex-direction:column;gap:20px">
  <div>
    <p style="margin:0 0 4px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;color:#4D6370">Step 1 · Plan your route</p>
    <h2 id="h-rivers" style="margin:0;font-family:'Archivo',sans-serif;font-size:32px;letter-spacing:-0.02em;font-weight:300">Pick your peaks and trails</h2>
    <p style="margin:6px 0 0;font-size:16px;color:#2F4753;max-width:62ch">Peaks are the causes you care about. Trails are the ways you can give. The map changes as you choose.</p>
  </div>
  <div style="border:1px solid #C9D6DC;border-radius:4px;background:linear-gradient(172deg,#DCEBF4 0%,#F1F5F6 55%,#F7EDE2 100%);overflow:hidden;padding:8px 8px 0;position:relative">
    <svg role="img" aria-label="{{mapLabel}}" viewBox="0 0 1100 450" style="display:block;width:100%;height:auto">
  <defs><linearGradient id="tmHaze" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#F7EDE2" stop-opacity="0"></stop><stop offset="1" stop-color="#F7EDE2" stop-opacity=".95"></stop></linearGradient></defs>
  <circle cx="930" cy="58" r="18" fill="none" stroke="#E89A5B" stroke-width="1"></circle>
  <path d="M0 210 L70 175 L130 190 L210 140 L270 170 L340 120 L410 160 L480 130 L560 170 L640 120 L720 165 L790 135 L870 175 L950 145 L1030 180 L1100 160" fill="none" stroke="#C3D1D8" stroke-width="1"></path>
  <polygon points="{{pk0.pts}}" style="{{pk0.poly}}"></polygon><circle cx="{{pk0.cx}}" cy="{{pk0.cy}}" r="4.5" style="{{pk0.flag}}"></circle>
  <polygon points="{{pk1.pts}}" style="{{pk1.poly}}"></polygon><circle cx="{{pk1.cx}}" cy="{{pk1.cy}}" r="4.5" style="{{pk1.flag}}"></circle>
  <polygon points="{{pk2.pts}}" style="{{pk2.poly}}"></polygon><circle cx="{{pk2.cx}}" cy="{{pk2.cy}}" r="4.5" style="{{pk2.flag}}"></circle>
  <polygon points="{{pk3.pts}}" style="{{pk3.poly}}"></polygon><circle cx="{{pk3.cx}}" cy="{{pk3.cy}}" r="4.5" style="{{pk3.flag}}"></circle>
  <polygon points="{{pk4.pts}}" style="{{pk4.poly}}"></polygon><circle cx="{{pk4.cx}}" cy="{{pk4.cy}}" r="4.5" style="{{pk4.flag}}"></circle>
  <polygon points="{{pk5.pts}}" style="{{pk5.poly}}"></polygon><circle cx="{{pk5.cx}}" cy="{{pk5.cy}}" r="4.5" style="{{pk5.flag}}"></circle><polygon points="{{pk6.pts}}" style="{{pk6.poly}}"></polygon><circle cx="{{pk6.cx}}" cy="{{pk6.cy}}" r="4.5" style="{{pk6.flag}}"></circle>
  <rect x="0" y="330" width="1100" height="120" fill="url(#tmHaze)"></rect>
  <g fill="none" stroke="#C3D1D8" stroke-width="0.8"><path d="M0 352 Q275 342 550 352 T1100 348"></path><path d="M0 376 Q275 368 550 378 T1100 372"></path><path d="M0 400 Q275 394 550 402 T1100 398"></path></g>
  <path d="{{tr0.d}}" fill="none" style="{{tr0.line}}"></path><polygon points="{{tr0.mpts}}" style="{{tr0.mark}}"></polygon>
  <path d="{{tr1.d}}" fill="none" style="{{tr1.line}}"></path><polygon points="{{tr1.mpts}}" style="{{tr1.mark}}"></polygon>
  <path d="{{tr2.d}}" fill="none" style="{{tr2.line}}"></path><polygon points="{{tr2.mpts}}" style="{{tr2.mark}}"></polygon>
  <path d="{{tr3.d}}" fill="none" style="{{tr3.line}}"></path><polygon points="{{tr3.mpts}}" style="{{tr3.mark}}"></polygon>
  <circle cx="550" cy="434" r="5" fill="#18303C"></circle>
  <g style="font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;fill:#4D6370"><text x="562" y="438">TRAILHEAD</text><text x="16" y="440">LOOKING EAST FROM LOOKOUT MTN · ILLUSTRATIVE MAP</text></g>
</svg>
    <span class="{{pk0.cls}}" style="{{pk0.lbl}}">{{pk0.label}}</span><span class="{{pk1.cls}}" style="{{pk1.lbl}}">{{pk1.label}}</span><span class="{{pk2.cls}}" style="{{pk2.lbl}}">{{pk2.label}}</span><span class="{{pk3.cls}}" style="{{pk3.lbl}}">{{pk3.label}}</span><span class="{{pk4.cls}}" style="{{pk4.lbl}}">{{pk4.label}}</span><span class="{{pk5.cls}}" style="{{pk5.lbl}}">{{pk5.label}}</span><span class="{{pk6.cls}}" style="{{pk6.lbl}}">{{pk6.label}}</span><span class="mlbl" style="{{tr0.lbl}}">{{tr0.label}}</span><span class="mlbl" style="{{tr1.lbl}}">{{tr1.label}}</span><span class="mlbl" style="{{tr2.lbl}}">{{tr2.label}}</span><span class="mlbl" style="{{tr3.lbl}}">{{tr3.label}}</span><span class="mcount" style="position:absolute;left:16px;top:12px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:0.08em;color:#4D6370">{{mapCount}}</span>
  </div>
  <div style="display:flex;flex-wrap:wrap;gap:24px 32px">
    <div role="group" aria-labelledby="g-peaks" style="flex:1 1 480px;min-width:0;display:flex;flex-direction:column;gap:10px">
      <h3 id="g-peaks" style="margin:0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#4D6370;font-weight:500">Peaks · what matters to you</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px">
        <sc-for list="{{causes}}" as="c" hint-placeholder-count="6">
          <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">
            <span style="display:flex;flex-direction:column;gap:3px;text-align:left"><span style="font-family:'Archivo',sans-serif;font-size:18px;font-weight:500;line-height:1.15">{{c.name}}</span><span style="font-size:13px;color:#4D6370">{{c.meta}}</span></span>
            <span style="{{c.markStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{c.checkStyle}}"><path d="M20 6 9 17l-5-5"></path></svg></span>
          </button>
        </sc-for>
      </div>
    </div>
    <div role="group" aria-labelledby="g-trails" style="flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:10px">
      <h3 id="g-trails" style="margin:0;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:#4D6370;font-weight:500">Trails · how you can give</h3>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px">
        <button type="button" onClick="{{wTime.toggle}}" aria-pressed="{{wTime.pressed}}" style="{{wTime.style}}">
          <svg width="38" height="38" viewBox="0 0 44 44" fill="none" aria-hidden="true" style="flex:none"><circle cx="22" cy="22" r="21" fill="#E89A5B"></circle><circle cx="22" cy="22" r="9" stroke="#18303C" stroke-width="2.4"></circle><path d="M22 17v5l3 2" stroke="#18303C" stroke-width="2.4" stroke-linecap="round"></path></svg>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left"><span style="font-size:18px;font-weight:500">Time</span><span style="font-size:13px;line-height:1.4;color:#2F4753">Shifts and projects, solo or with friends</span></span>
          <span style="{{wTime.markStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{wTime.checkStyle}}"><path d="M20 6 9 17l-5-5"></path></svg></span>
        </button>
        <button type="button" onClick="{{wMoney.toggle}}" aria-pressed="{{wMoney.pressed}}" style="{{wMoney.style}}">
          <svg width="38" height="38" viewBox="0 0 44 44" fill="none" aria-hidden="true" style="flex:none"><polygon points="22,1 43,22 22,43 1,22" fill="#D9B76E"></polygon><path d="M22 13v18M26 17.5h-6a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6h-7" stroke="#18303C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left"><span style="font-size:18px;font-weight:500">Money</span><span style="font-size:13px;line-height:1.4;color:#2F4753">Active campaigns, with what a gift buys</span></span>
          <span style="{{wMoney.markStyle}}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{wMoney.checkStyle}}"><path d="M20 6 9 17l-5-5"></path></svg></span>
        </button>
        <button type="button" onClick="{{wGoods.toggle}}" aria-pressed="{{wGoods.pressed}}" style="{{wGoods.style}}">

      <p style="margin:0;font-size:15px;line-height:1.5;color:#2B414D">The 2026 golf tournament was held September 22 at The Ridge at Castle Pines, and registration is closed. It stays visible as a past event, with no sign-up button, and will not appear in search results. Questions about the event went to jessicapurcel@thrivingfamiliescolorado.org.</p>

      <p style="margin:0;font-size:20px;font-weight:700">Baby gear, clothing, feeding and diapering supplies</p>
      <p style="margin:0;font-size:15px;line-height:1.5;color:#2B414D">Their team sorts every donation and gives it directly to families in their programs.</p>
      <dl style="margin:0;display:grid;grid-template-columns:120px 1fr;gap:6px 12px;font-size:15px">
        <dt style="color:#4D6370">Gear</dt><dd style="margin:0">Car seats (accident-free, not expired), compact pack ’n plays or bassinets, strollers, bouncers, carriers, swaddles</dd>
        <dt style="color:#4D6370">Clothing</dt><dd style="margin:0">Baby and toddler up to 5T, kids shoes up to size 2, maternity</dd>
        <dt style="color:#4D6370">Feeding</dt><dd style="margin:0">Bottles, unopened formula, complete breast pumps, new nursing pads, milk storage bags</dd>
        <dt style="color:#4D6370">Diapering</dt><dd style="margin:0">Diapers (all sizes), wipes, diaper bags</dd>

        <dt style="color:#4D6370">Can’t take</dt><dd style="margin:0">Toys, full-size cribs, toddler beds, adult clothing, housewares, used stuffed animals, clothing over 5T</dd>
        <dt style="color:#4D6370">Drop off</dt><dd style="margin:0">191 Yuma St., main entrance · Mon–Fri 9–4 or by appointment</dd>
        <dt style="color:#4D6370">Receipts</dt><dd style="margin:0">Tax receipts at drop-off (501(c)(3))</dd>
      </dl>
      <p style="margin:0;font-size:14px;line-height:1.5;padding:10px 12px;border-radius:4px;background:#F1F5F6"><strong>Something they can’t take?</strong> They suggest WeeCycle, The Gathering Place, The Action Center or Habitat for Humanity ReStore. Planning a community drive? Email info@thrivingfamiliescolorado.org or call 720-504-4624.</p>

      <p style="margin:0;font-size:15px;line-height:1.5;color:#2B414D">Families pick out gifts at the Toy Shoppe, stocked by neighbors. Host a collection box at your office, or buy from their Amazon wish list. Gifts must be new.</p>
      <a href="https://www.amazon.com/registries/gl/guest-view/VJCWZPM01XUJ" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:48px;padding:0 20px;border-radius:999px;font-size:16px;font-weight:700;text-decoration:none;background:#3B6755;color:#FFFFFF;border:0">Open the Amazon wish list<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>

  <div style="display:flex;align-items:center;gap:12px;margin-top:12px"><span style="display:inline-block;flex:none;width:16px;height:16px;background:#D9B76E;border-radius:2px;transform:rotate(45deg) scale(0.74)"></span><h3 style="margin:0;font-family:'Archivo',sans-serif;font-size:22px;font-weight:500">Money</h3><span style="font-size:14px;color:#4D6370">4 ways</span></div>
  <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(520px, 1fr));gap:16px">
    <section aria-labelledby="o-money" style="background:#FFFFFF;border:1px solid #C9D6DC;border-top:3px solid #D9B76E;border-radius:4px;padding:22px;display:flex;flex-direction:column;gap:12px">

      <p style="margin:0;font-size:20px;font-weight:700">Start a monthly gift: new recurring gifts are matched</p>
      <div style="display:flex;flex-direction:column;gap:6px">
        <div style="height:10px;border-radius:999px;background:#F7EDD0;overflow:hidden"><div style="width:2%;min-width:6px;height:100%;background:#D9B76E"></div></div>
        <span style="font-size:14px;color:#4D6370">$150 of $10,000 raised from 2 donors · at last check on Colorado Gives</span>

        <dt style="color:#4D6370">Match</dt><dd style="margin:0">Up to $100 per new monthly gift, from the Colorado Gives Foundation</dd>

      <button type="button" onClick="{{actMoney}}" style="align-self:flex-start;min-height:48px;padding:0 20px;background:#D9B76E;color:#18303C;border:0;border-radius:999px;font-size:16px;font-weight:700;cursor:pointer">Give on ColoradoGives</button>
    </section>

    <section style="border:1px solid #C9D6DC;border-top:3px solid #D9B76E;border-radius:4px;padding:22px;display:flex;flex-direction:column;gap:12px;background:#FFFFFF">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;color:#6B4C00;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500">Money</h3><span style="padding:4px 10px;border-radius:999px;background:#E6EEF1;color:#18303C;font-size:13px;font-weight:700">Direct giving</span></div>
      <p style="margin:0;font-size:20px;font-weight:700">Give directly on their website</p>
      <p style="margin:0;font-size:15px;line-height:1.5;color:#2B414D">Prefer to skip the platform? Give straight to Thriving Families. Their form takes one-time or monthly gifts, by credit card or bank transfer. The $100 match applies to monthly gifts made on Colorado Gives.</p><p style="margin:0;font-size:14px;line-height:1.5;padding:10px 12px;border-radius:4px;background:#F7EDD0;color:#6B4C00"><strong>On their form:</strong> one-time gifts of $100, $250, $500, $1,000 or another amount; a monthly tab; individual or company; an option to cover fees, dedicate the gift or give without public recognition; and a request-an-invoice option to pay later. Receipts go to your email.</p>
      <a href="https://thrivingfamiliescolorado.org/give-now" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:48px;padding:0 20px;border-radius:999px;font-size:16px;font-weight:700;text-decoration:none;background:#FFFFFF;color:#18303C;border:1.5px solid #9FB2BC">Give on their site<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
    </section>

    <section style="border:1px solid #C9D6DC;border-top:3px solid #D9B76E;border-radius:4px;padding:22px;display:flex;flex-direction:column;gap:12px;background:#FFFFFF">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;color:#6B4C00;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500">Money</h3><span style="padding:4px 10px;border-radius:999px;background:#E6EEF1;color:#18303C;font-size:13px;font-weight:700">Capital campaign</span></div>
      <p style="margin:0;font-size:20px;font-weight:700">Help build "the nest": their new home at 191 Yuma St.</p>
      <p style="margin:0;font-size:15px;line-height:1.5;color:#2B414D">They bought the building in May 2024 with a $1 million State of Colorado grant. The 20,000 sq ft building in Denver's Valverde neighborhood lets them run every program in person again, with room for 60+ cars. They run more than 200 MotherWise workshops a year, and the plan adds: two 1,200 sq ft workshop rooms (25+ mothers and babies each), onsite childcare with play structures and a nap room, a food pantry, a baby boutique with free car seats, portable cribs, diapers and clothing, a kitchen for the 100 to 200 meals they serve weekly, and confidential second-floor mental health rooms.</p><p style="margin:0;font-size:14px;line-height:1.5;padding:10px 12px;border-radius:4px;background:#F7EDD0;color:#6B4C00"><strong>To add:</strong> a dollar goal, amount raised and giving levels. Their campaign page doesn't list them, so that's a question for Thriving Families.</p>
      <a href="https://thrivingfamiliescolorado.org/give-now" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:8px;align-self:flex-start;min-height:48px;padding:0 20px;border-radius:999px;font-size:16px;font-weight:700;text-decoration:none;background:#D9B76E;color:#18303C;border:0">Become a nest builder<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"></path></svg></a>
    </section>

    <section style="background:#FFFFFF;border:1px solid #C9D6DC;border-top:3px solid #D9B76E;border-radius:4px;padding:22px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0;font-size:14px;letter-spacing:0.06em;text-transform:uppercase;color:#6B4C00;font-family:'IBM Plex Mono',ui-monospace,monospace;font-weight:500">Money</h3><span style="padding:4px 10px;border-radius:999px;background:#E6EEF1;color:#18303C;font-size:13px;font-weight:700">Event sponsorship</span></div>
